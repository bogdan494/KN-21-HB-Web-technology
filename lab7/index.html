<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Анімації та Ефекти</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <section class="task-section">
            <h2>Завдання 1. Плавна зміна кольору кнопки</h2>
            <button class="button">Інтерактивна кнопка</button>
        </section>

        <section class="task-section">
            <h2>Завдання 2. Плавне розгортання текстового блоку</h2>
            <div class="expand-container">
                <p class="hint">Розгорнути текст</p>
                <div class="content">
                    <p>Реалізовано розгортання тексту.</p>
                </div>
            </div>
        </section>

        <section class="task-section">
            <h2>Завдання 3. Анімація руху блоку</h2>
            <div class="box"></div>
        </section>

        <section class="task-section bonus-section">
            <h2>Додаткове завдання</h2>
            <button id="start-circle-btn">Запустити рух кола</button>
            <div class="circle-container">
                <div id="moving-circle" class="circle"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
