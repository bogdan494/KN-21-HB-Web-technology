<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список користувачів</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Список користувачів</h2>
        
        <table id="users-table">
            <thead>
                <tr>
                    <th style="width: 10%;">ID</th>
                    <th style="width: 45%;">Ім'я</th>
                    <th style="width: 45%;">Email</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>

        <div class="action-center">
            <button id="refresh-btn" class="btn btn-blue">Оновити</button>
        </div>

        <hr class="divider">

        <div class="form-container">
            <h3>Додати нового користувача</h3>
            <form id="add-user-form">
                <div class="form-group">
                    <label for="user-name">Ім'я:</label>
                    <input type="text" id="user-name" placeholder="Введіть ім'я" required>
                </div>
                <div class="form-group">
                    <label for="user-email">Email:</label>
                    <input type="email" id="user-email" placeholder="Введіть email" required>
                </div>
                <button type="submit" class="btn btn-green">Додати користувача</button>
            </form>
        </div>
    </div>

</body>
</html>
