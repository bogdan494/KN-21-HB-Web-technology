<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 5: Маніпуляція DOM та обробка подій</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Маніпуляція DOM та обробка подій</h1>
    </header>
    <main>
        <section>
            <h2>Натисніть побачите результат</h2>
            <button id="chekButton">Натисніть 10 разів</button>
        </section>
        <section>
            <h2 id="title">Зміна вмісту елемента</h2>
            <p id="myText">Текст зміниться! Це новий вміст</p>
            <button id="editButton">Змінити текст</button>
        </section>
        <section>
            <h2>Обробка подій</h2>
            <button id="mouseButton">Наведіть курсор</button>
            <p>Наведіть курсор на кнопку побачите зміну стилю.</p>
        </section>
        <section>
            <h2>Робота над елементами</h2>
                <button id="addElement">Додати елемент</button>
                <button id="delElement">Видалити елемент</button>
            <div id="container"><p class="element">Це новий введений елемент.</p></div>
        </section>
        <script src="script.js"></script>
    </main>
    <footer><p>Лабораторна робота 5. JavaScript, DOM, події.</p></footer>
</body>
</html>
